[package]
name = "onezipper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Collapse folders of many small files into one zip each, so cloud sync uploads one large file instead of thousands of tiny ones."

[dependencies]
crc32fast = "1.5.0"
time = { version = "0.3.55", features = ["local-offset"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "time"] }
